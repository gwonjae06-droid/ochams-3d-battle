<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>배송지: 멸망구역 · 웹소설·스토리 전투 v5.38</title><link rel="stylesheet" href="./src/story-skin-v536.css?v=5.36"><main id="app"><div class="bar"><a data-back-game href="./index.html">메인 게임으로</a><a href="./story-mvp.html">이전 텍스트 목업</a></div><p id="notice" role="status" aria-live="polite"></p><p id="fail" hidden>화면을 불러오지 못했습니다. 연결과 콘솔 오류를 확인하세요.</p><section id="home"><small>DELIVERY TO THE END · v5.38</small><h1>배송지: 멸망구역</h1><p>세상은 망했는데, 배달 예정 시간은 그대로다.</p><button id="new">1화부터 시작</button> <button id="resume">이어하기</button><p>1~6화 확장 원고 · 웹소설형 대화와 스토리 인원에 맞춘 실전 전투. 전투 승패에 따라 진행합니다.</p></section><section id="vn" hidden><div class="bar"><span id="ep"></span></div><div class="bar"><span id="party"></span><span id="bills"></span></div><div id="stage"><div id="cast"><div class="side" id="left"></div><div class="side" id="right"></div></div></div><div id="box" tabindex="0" role="button" aria-label="다음 대사"><div id="name"></div><p id="text"></p><span id="more" aria-hidden="true">▼</span></div><p id="mock" hidden>스토리 실전 전투 · 합류한 인물만 참가합니다.</p><div id="actions"></div><button id="adapter" hidden>전투 시작</button><div class="tools"><button id="skip">현재 장면 건너뛰기</button><button id="back">목록으로</button><button id="restart">처음부터</button><button id="export">저장 내보내기</button></div><p id="saved"></p></section><section><label>저장 가져오기 <input id="import" type="file" accept="application/json,.json"></label></section><p id="note">사진을 불러오지 못하면 이니셜로 표시됩니다. 최규원 사진 자산은 별도 반영 예정입니다.</p></main><script type="module">
const $=id=>document.getElementById(id),KEY='ochams-delivery-mvp-v1';
let mods;try{mods=await Promise.all([import('./src/story-engine-v533.js?v=5.33'),import('./src/story-vn-v538.js?v=5.38'),import('./src/story-script-v534.js?v=5.37')]);if(!window.DeliveryBattleAdapter?.storyReal)throw Error('실전 전투 연결 실패');}catch(e){$('fail').hidden=false;$('notice').textContent=e.message;throw e;}
const C=mods[0].DeliveryStory,{createViewer,TYPE_LABEL}=mods[1];let memory='',busy=false;const note=t=>$('notice').textContent=t;
const V=createViewer(C,{read(){try{return localStorage.getItem(KEY)||memory;}catch{return memory;}},write(t){memory=t;try{localStorage.setItem(KEY,t);return true;}catch{return false;}}},mods[2].SCRIPT);
function figs(el,list){el.replaceChildren();for(const f of list){const d=document.createElement('div'),b=document.createElement('b'),n=document.createElement('small');d.className='fig'+(f.active?' active':'');d.style.setProperty('--c',f.color);b.textContent=f.initial;n.textContent=f.name;d.append(b,n);el.append(d);}}
function home(){V.close();busy=false;$('home').hidden=false;$('vn').hidden=true;$('resume').disabled=!V.canResume();}
function act(id,rev,token,verified=false){if(busy)return;const s=V.state;if(C.current(s).type==='battle'&&!s.failed&&!verified)return;if(V.act(id,rev,token))draw();else note(V.message);}
function draw(){const v=V.view();if(!v)return home();$('home').hidden=true;$('vn').hidden=false;$('ep').textContent=v.ch+'화 / 6화 · '+v.theme.title+' · '+TYPE_LABEL[v.type]+' · 대사 '+(v.index+1)+'/'+v.total;$('party').textContent='파티: '+v.party.map(id=>C.names[id]).join(' · ');$('bills').textContent='누적 청구 '+v.bills.toLocaleString()+'원 / 배달 수당 2,900원';$('stage').style.setProperty('--bg',v.theme.bg);figs($('left'),v.cast.left);figs($('right'),v.cast.right);$('name').textContent=v.line.who;$('text').textContent=v.line.text;$('more').hidden=v.last;$('actions').replaceChildren();
if(v.last&&(!v.mock||v.failed))for(const o of v.actions){const b=document.createElement('button');b.textContent=o.label;b.dataset.action=o.id;b.disabled=busy;b.onclick=()=>act(o.id,v.rev,v.token);$('actions').append(b);}
$('mock').hidden=!(v.mock&&v.last);$('adapter').hidden=!(v.mock&&v.last)||v.failed;$('adapter').disabled=busy;$('skip').disabled=v.last||busy;$('saved').textContent=v.saved?'자동 저장됨':'저장 차단 환경 · 내보내기로 보관하세요.';note(v.failed?'패배했습니다. 현재 전투에서 재도전하세요.':v.end&&v.last?'6화 완주 · '+(v.settlement.net<0?'추가 근무 예약 결말':'정산 0원 결말'):'');}
function advance(){if(!busy&&V.advance())draw();}
function fresh(){if(V.canResume()&&!confirm('새 스토리 저장만 초기화할까요?'))return;V.start();busy=false;draw();}
$('new').onclick=$('restart').onclick=fresh;$('back').onclick=home;$('resume').onclick=()=>{if(V.resume())draw();else{home();note(V.message);}};$('box').onclick=advance;$('skip').onclick=()=>{if(!busy&&V.skip())draw();};
$('adapter').onclick=async()=>{if(busy)return;const v=V.view();busy=true;draw();note('전투를 불러오는 중입니다.');try{const result=await window.DeliveryBattleAdapter.runEncounter({snapshot:V.state});if(V.view()?.token!==v.token)return;busy=false;act(result.outcome,v.rev,v.token,true);}catch(e){if(V.view()?.token!==v.token)return;busy=false;draw();note(e.message);}};
$('export').onclick=()=>{if(!V.state)return;const u=URL.createObjectURL(new Blob([JSON.stringify(V.state)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='delivery-story-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);};
$('import').onchange=async e=>{const f=e.target.files[0];if(!f||busy)return;try{if(f.size>100000)throw Error('저장 파일이 너무 큽니다.');if(V.resume(await f.text()))draw();else note(V.message);}catch(err){note(err.message);}e.target.value='';};document.addEventListener('keydown',e=>{if($('vn').hidden||e.repeat||['INPUT','BUTTON','A','TEXTAREA'].includes(e.target?.tagName))return;if(['Enter',' ','ArrowRight'].includes(e.key)){e.preventDefault();advance();}});
window.DeliveryStory=C;window.DeliveryStoryApp={getState:()=>V.state};home();const q=new URL(location.href).searchParams;if(q.get('new')==='1')fresh();else if(q.get('continue')==='1'&&V.canResume())$('resume').click();
</script></html>
