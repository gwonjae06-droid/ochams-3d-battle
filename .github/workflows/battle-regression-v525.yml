name: Battle regression
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  battle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: battle-browser-report
          path: test-results
          if-no-files-found: ignore
