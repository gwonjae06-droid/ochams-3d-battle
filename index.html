<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오챔스 · 성운의 턱검룡</title><style>*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#253555;color:#f4f7ff;font:14px system-ui;overflow:hidden}canvas{display:block}header{position:fixed;top:18px;left:18px;pointer-events:none}h1{font-size:17px;margin:0 0 8px}#order{line-height:2;color:#b9eeff}#boss{position:fixed;top:18px;left:50%;transform:translateX(-50%);width:min(48vw,620px);text-align:center;background:#122744d9;padding:10px 18px;border:1px solid #96c4e9;border-radius:10px}progress{height:12px;border:0}#bhp{width:100%;accent-color:#d28bff}#next{color:#ffdcae;margin-top:4px}#status{position:fixed;top:125px;left:15px;right:15px;text-align:center;pointer-events:none;text-shadow:0 2px 5px #000}#player{position:fixed;left:22px;bottom:24px;width:255px;padding:14px;background:#122744e8;border:1px solid #8ab8de;border-radius:10px;line-height:1.9}#player progress{width:100%}#php{accent-color:#76ffcd}#en{accent-color:#ff879c}nav{position:fixed;bottom:24px;right:22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:calc(100vw - 310px)}button{background:#1b3554ef;color:white;border:1px solid #a9d3f5;border-radius:10px;padding:14px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #ffe3a6}#ult{background:#5f243f;border-color:#ffa7c1}#damage,#pdamage,#self{position:fixed;pointer-events:none;transform:translate(-50%,-50%);text-shadow:0 3px 8px #000;font-weight:800}#damage{color:#ffe6ac;font-size:38px}#damage.big{font-size:60px}#pdamage{color:#ff9b9b;font-size:32px}#pdamage.heal{color:#7effc2}#self{color:#8effcf}#flash{position:fixed;inset:0;background:#fff1e5;opacity:0;pointer-events:none}#title{position:fixed;bottom:26%;left:7%;font-size:clamp(24px,5vw,54px);font-weight:900;color:#ffd9ed;text-shadow:0 0 20px #ab284f;opacity:0;pointer-events:none}#result{position:fixed;inset:20% 0 30%;display:grid;place-items:center;background:#14213caa;font-size:clamp(40px,8vw,100px);font-weight:900;pointer-events:none}body.cinematic nav{opacity:.3;pointer-events:none}body.ultimate #title{border-left:5px solid #ffb9d2;padding-left:16px}@media(max-width:720px){header h1{font-size:12px}#boss{width:60vw;left:65%;padding:7px;font-size:12px}#player{left:10px;bottom:10px;width:170px;padding:8px;font-size:12px}nav{right:8px;bottom:12px;max-width:calc(100vw - 190px);gap:4px}button{padding:10px;font-size:12px}#status{top:135px;font-size:12px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><header><h1>오챔스 · 우주 보스전</h1><div id="order">배서준 → 턱검룡</div></header><section id="boss">성운의 턱검룡<progress id="bhp" max="2400" value="2400"></progress><span id="bhptext"></span><div id="next"></div></section><div id="status" role="status">전장 로딩 중…</div><section id="player">배서준 <span id="phptext"></span><progress id="php" max="195" value="195"></progress>궁극기 에너지 <span id="entext"></span><progress id="en" max="100" value="0"></progress><div id="buff"></div></section><nav><button id="attack">일반공격</button><button id="skill">기술 · 벌크업</button><button id="ult">궁극기</button><button id="confirm" hidden>배서준에게 적용</button><button id="cancel" hidden>취소</button><button id="reset">초기화</button><button id="sound">사운드: 켜짐</button></nav><div id="self" hidden>▼ 배서준 · 자기 대상</div><div id="damage" hidden></div><div id="pdamage" hidden></div><div id="flash"></div><div id="title"></div><div id="result" hidden></div><script type="module">import('./src/battle.js?v=cosmic1').catch(e=>{console.error(e);document.getElementById('status').textContent='로딩 실패: '+e.message;});</script></body></html>
