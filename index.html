<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오챔스 · 배서준 전투 연구</title><style>*{box-sizing:border-box}body{margin:0;background:#101521;color:#f2f4fa;font:14px system-ui;overflow:hidden}canvas{display:block}header{position:fixed;top:20px;left:22px;pointer-events:none;transition:opacity .25s}h1{font-size:18px;margin:0 0 6px}small{color:#bac4d7}#enemy{position:fixed;top:22px;right:22px;text-align:right;transition:opacity .25s}progress{width:180px;accent-color:#ef837b}#status{position:fixed;top:85px;left:22px;right:22px;text-align:center;pointer-events:none;transition:opacity .25s}footer{position:fixed;bottom:22px;left:22px;right:22px;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;transition:opacity .25s}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #728098;background:#182438e8;color:white;border-radius:10px;padding:13px 17px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #ffd18a}#ult{border-color:#ff7b8b;background:#4a1420e8}#confirm{border-color:#79eec5;background:#164c43}#self{position:fixed;pointer-events:none;color:#91ffce;transform:translate(-50%,-50%);text-align:center;text-shadow:0 2px 5px black}#damage{position:fixed;pointer-events:none;color:#ffe1a0;font-size:38px;font-weight:700;transform:translate(-50%,-50%);text-shadow:0 3px 6px black}#damage.big{font-size:68px;color:#ff9aa6}#flash{position:fixed;inset:0;background:#ffe3dc;pointer-events:none;opacity:0}#title{position:fixed;left:7%;bottom:24%;font-size:clamp(24px,5vw,56px);font-weight:800;letter-spacing:.08em;color:#ffd7dc;text-shadow:0 0 24px #ff2e45;opacity:0;pointer-events:none}.bar{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height .35s}#bt{top:0}#bb{bottom:0}body.cinematic footer{opacity:.25;pointer-events:none}body.ultimate .bar{height:11vh}body.ultimate footer,body.ultimate header,body.ultimate #enemy,body.ultimate #status{opacity:0}@media(max-width:600px){header{top:12px;left:12px}h1{font-size:15px}#enemy{top:12px;right:12px}progress{width:110px}footer{left:12px;right:12px;bottom:12px}button{padding:11px}#status{top:100px;font-size:13px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script></head><body><header><h1>오챔스 / 배서준</h1><small>168cm · 마른 남성 · 모션 프로토타입</small><div>행동 순서: 배서준 → 훈련 표적</div></header><section id="enemy">훈련 표적<br><progress id="hp" max="500" value="500"></progress><div id="hptext">500 / 500</div></section><div id="status" role="status">모듈 로딩 중…</div><div id="self" hidden>▼ 자기 대상<br>배서준</div><div id="damage" hidden></div><div id="flash"></div><div id="title"></div><div class="bar" id="bt"></div><div class="bar" id="bb"></div><footer><section>배서준<br><span id="buff">공격 +0 / 방어 +0</span></section><nav aria-label="전투 행동"><button id="attack">일반공격</button><button id="skill">기술 · 벌크업</button><button id="ult">궁극기 · 블러드 문</button><button id="confirm" hidden>배서준에게 적용</button><button id="cancel" hidden>취소</button><button id="reset">초기화</button></nav></footer><script type="module">import('./src/battle.js').catch(e=>{console.error(e);document.querySelector('#status').textContent='로딩 실패: '+((e&&e.message)||e)+' · HTTP 서버와 인터넷 연결을 확인하세요.';});</script></body></html>
