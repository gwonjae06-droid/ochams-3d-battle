<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>오챔스 · 배서준 vs 턱검룡</title><style>*{box-sizing:border-box}body{margin:0;background:#101521;color:#f2f4fa;font:14px system-ui;overflow:hidden}canvas{display:block}header{position:fixed;top:20px;left:22px;pointer-events:none;transition:opacity .25s}h1{font-size:18px;margin:0 0 6px}small{color:#bac4d7}#order{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px;width:150px}#order li{border:1px solid #5a6b86;border-radius:8px;padding:6px 14px;background:#182438cc;opacity:.55}#order li.on{border-color:#79eec5;opacity:1}#boss{position:fixed;top:22px;right:22px;text-align:right;transition:opacity .25s;max-width:46vw}#boss progress{width:260px;accent-color:#b06cff}#next{color:#ffb4c0;margin-top:4px}progress{accent-color:#ef837b}#status{position:fixed;top:85px;left:22px;right:22px;text-align:center;pointer-events:none;transition:opacity .25s}footer{position:fixed;bottom:22px;left:22px;right:22px;display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;transition:opacity .25s}footer section{line-height:1.7}footer progress{width:170px}#en{accent-color:#ff5d73}#php{accent-color:#79eec5}nav{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #728098;background:#182438e8;color:white;border-radius:10px;padding:13px 17px;cursor:pointer}button:disabled{opacity:.4;cursor:default}button:focus-visible{outline:3px solid #ffd18a}#ult{border-color:#ff7b8b;background:#4a1420e8}#confirm{border-color:#79eec5;background:#164c43}#dodge{position:fixed;left:50%;bottom:30%;transform:translateX(-50%);font-size:clamp(26px,5vw,48px);font-weight:800;padding:18px 40px;border:3px solid #ffe08a;background:#3a2a05ee;color:#ffe9a8;border-radius:16px;animation:pulse .35s infinite alternate}@keyframes pulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.08)}}#dodge[hidden]{display:none}#self{position:fixed;pointer-events:none;color:#91ffce;transform:translate(-50%,-50%);text-align:center;text-shadow:0 2px 5px black}#damage{position:fixed;pointer-events:none;color:#ffe1a0;font-size:38px;font-weight:700;transform:translate(-50%,-50%);text-shadow:0 3px 6px black}#damage.big{font-size:68px;color:#ff9aa6}#pdamage{position:fixed;pointer-events:none;font-size:40px;font-weight:800;transform:translate(-50%,-50%);text-shadow:0 3px 6px black}#pdamage.hit{color:#ff6070}#pdamage.ok{color:#8affc8}#pdamage.heal{color:#7dff9a}#flash{position:fixed;inset:0;background:#ffe3dc;pointer-events:none;opacity:0}#title{position:fixed;left:7%;bottom:24%;font-size:clamp(24px,5vw,56px);font-weight:800;letter-spacing:.08em;color:#ffd7dc;text-shadow:0 0 24px #ff2e45;opacity:0;pointer-events:none}#result{position:fixed;inset:0;display:grid;place-items:center;font-size:clamp(40px,9vw,110px);font-weight:900;pointer-events:none;text-shadow:0 6px 30px #000;background:#0008}.bar{position:fixed;left:0;right:0;height:0;background:#000;pointer-events:none;transition:height .35s}#bt{top:0}#bb{bottom:0}body.cinematic footer{opacity:.3;pointer-events:none}body.ultimate .bar{height:11vh}body.ultimate footer,body.ultimate header,body.ultimate #boss,body.ultimate #status{opacity:0}@media(max-width:600px){header{top:12px;left:12px}h1{font-size:15px}#order{width:120px}#boss{top:12px;right:12px}#boss progress{width:150px}footer{left:12px;right:12px;bottom:12px}footer progress{width:120px}button{padding:11px}#status{top:100px;font-size:13px}}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"}}</script></head><body><header><h1>오챔스 / 보스전</h1><small>배서준 vs 턱검룡 · 난이도 어려움</small><ol id="order" aria-label="행동 순서"><li id="oPlayer" class="on">배서준</li><li id="oBoss">턱검룡</li></ol></header><section id="boss"><b>턱검룡 · 턱칼의 군주</b><br><progress id="bhp" max="2400" value="2400"></progress><div id="bhptext">2400 / 2400</div><div id="next"></div></section><div id="status" role="status">모듈 로딩 중…</div><div id="self" hidden>▼ 자기 대상<br>배서준</div><div id="damage" hidden></div><div id="pdamage" hidden></div><div id="flash"></div><div id="title"></div><div id="result" hidden></div><div class="bar" id="bt"></div><div class="bar" id="bb"></div><button id="dodge" hidden>회피! (Space)</button><footer><section>배서준 HP <progress id="php" max="195" value="195"></progress> <span id="phptext">195 / 195</span><br>궁극기 에너지 <progress id="en" max="100" value="0"></progress> <span id="entext">0 / 100</span><br><span id="buff">공격 +0 / 방어 +0</span></section><nav aria-label="전투 행동"><button id="attack">일반공격</button><button id="skill">기술 · 벌크업</button><button id="ult">궁극기 · 블러드 문</button><button id="confirm" hidden>배서준에게 적용</button><button id="cancel" hidden>취소</button><button id="reset">초기화</button><button id="sound">사운드: 켜짐</button></nav></footer><script type="module">import('./src/battle.js').catch(e=>{console.error(e);document.querySelector('#status').textContent='로딩 실패: '+((e&&e.message)||e)+' · HTTP 서버와 인터넷 연결을 확인하세요.';});</script></body></html>
